# Build the Framework Cloud image from this repository instead of pulling a
# release. From docker/selfhost in a clone:
#
#   docker compose -f compose.yml -f compose.build.yml up -d --build

x-build: &build
  build:
    context: ../..
    dockerfile: docker/selfhost/Dockerfile
  image: framework-cloud:local

services:
  app:
    <<: *build
  worker:
    <<: *build
