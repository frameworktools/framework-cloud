# Build the Framework Cloud image from this repository instead of pulling a
# release. app builds it; worker and scheduler run the same local image.
# From docker/selfhost in a clone:
#
#   docker compose -f compose.yml -f compose.build.yml up -d --build

services:
  app:
    build:
      context: ../..
      dockerfile: docker/selfhost/Dockerfile
    image: framework-cloud:local
  # Building the same tag from three services at once fails with
  # "image already exists", so these two only run what app built
  worker:
    image: framework-cloud:local
    pull_policy: never
  scheduler:
    image: framework-cloud:local
    pull_policy: never
  scaffolder:
    build:
      context: ../scaffolder
    image: framework-scaffolder:local
