; Framework Cloud runtime settings
expose_php = Off
memory_limit = 256M
; Published notebooks upload as files or zip bundles of up to 50 MB
upload_max_filesize = 60M
post_max_size = 64M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
