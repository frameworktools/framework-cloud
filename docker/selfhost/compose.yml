# Framework Cloud, self-hosted with Docker. In a folder with this file and
# a filled-in .env:
#
#   docker compose up -d
#
# The image comes from ghcr.io/frameworktools/framework-cloud. To build it
# from a clone of the repository instead, add compose.build.yml:
#
#   docker compose -f compose.yml -f compose.build.yml up -d --build
#
# Guide: https://framework.pub/docs/install-docker

name: framework-cloud

x-app: &app
  # FRAMEWORK_CLOUD_VERSION pins a release, such as 1.2.0
  image: ghcr.io/frameworktools/framework-cloud:${FRAMEWORK_CLOUD_VERSION:-latest}
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      # HTTP_BIND=127.0.0.1 makes the server reachable only from this computer
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Set once migrations and seeding are done and the server is starting
      test: ["CMD", "test", "-f", "/tmp/framework-cloud-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--max-time=3600"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      # The app container migrates and seeds; the worker waits for it
      FW_PREPARE_DATABASE: "false"
    volumes:
      - storage:/app/storage
      # The base image declares these; mounting them avoids anonymous volumes
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-framework_cloud}
      POSTGRES_USER: ${DB_USERNAME:-framework_cloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  postgres:
  caddy_data:
  caddy_config:
