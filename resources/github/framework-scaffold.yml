# Committed by framework.pub to scaffold this project once. It runs the
# framework R package on .framework/layers.json, commits the result, and
# framework.pub removes this file when the run succeeds.
name: Framework scaffold

on:
  push:
    paths:
      - .github/workflows/framework-scaffold.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for layers
        id: layers
        run: |
          if [ -f .framework/layers.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "This project is already scaffolded."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.layers.outputs.present == 'true'
        with:
          use-public-rspm: true

      - name: Install framework
        if: steps.layers.outputs.present == 'true'
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak(c("{{framework_ref}}", "renv"))

      - name: Scaffold
        if: steps.layers.outputs.present == 'true'
        shell: Rscript {0}
        run: |
          framework::project_create_from_layers(".framework/layers.json", path = ".", interactive = FALSE)

      - name: Commit
        if: steps.layers.outputs.present == 'true'
        run: |
          git rm -q .framework/layers.json
          git add -A
          git -c user.name="framework.pub" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Scaffold with Framework"
          git push
